name: NorthStar Supabase service-page sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/seo/sync-services.mjs'
      - '.github/workflows/northstar-service-pages.yml'
  schedule:
    - cron: '20 14 * * 1,3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: northstar-service-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Generate service pages from Supabase
        env:
          SUPABASE_URL: https://imljjaurxiawfxjckkqf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/seo/sync-services.mjs
      - name: Commit and publish changed pages
        id: publish
        run: |
          git config user.name "northstar-seo-bot"
          git config user.email "northstar-seo-bot@users.noreply.github.com"
          git add freight-services sitemap.xml ship/index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new service-page changes."
          else
            git commit -m "Publish Supabase freight service pages"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        run: sleep 120
      - name: Notify IndexNow
        if: steps.publish.outputs.changed == 'true'
        run: node scripts/indexnow.mjs
