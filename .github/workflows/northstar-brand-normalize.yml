name: NorthStar sitewide brand consistency

on:
  push:
    branches:
      - homepage/brand-proof-video-refresh
    paths:
      - '.github/workflows/northstar-brand-normalize.yml'
      - 'scripts/seo/normalize-brand.mjs'

permissions:
  contents: write

concurrency:
  group: northstar-brand-normalize
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate repository
        run: npm test
      - name: Standardize public brand across sitemap pages
        run: node scripts/seo/normalize-brand.mjs
      - name: Commit sitewide page updates
        run: |
          git config user.name "northstar-brand-bot"
          git config user.email "northstar-brand-bot@users.noreply.github.com"
          git add -u -- '*.html'
          if git diff --cached --quiet; then
            echo "No additional HTML changes were required."
          else
            git commit -m "Standardize NorthStar brand across public pages"
            git push origin "HEAD:\${GITHUB_REF_NAME}"
          fi
