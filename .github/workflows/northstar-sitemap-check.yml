name: NorthStar sitemap validation

on:
  pull_request:
    paths:
      - 'scripts/marketing/lib/site.mjs'
      - 'scripts/marketing/test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/northstar-sitemap-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/marketing/lib/site.mjs'
      - 'scripts/marketing/test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/northstar-sitemap-check.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
