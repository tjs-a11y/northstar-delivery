<style>
  :root{
    --asphalt:#0E151C;
    --asphalt-2:#16212B;
    --steel:#1F3448;
    --steel-line:#2C4257;
    --amber:#F2A93B;
    --paper:#F4F1E9;
    --paper-dim:#C9C7BE;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 78px, rgba(242,169,59,0.05) 78px, rgba(242,169,59,0.05) 80px),
      linear-gradient(180deg, var(--asphalt) 0%, var(--asphalt-2) 100%);
    color:var(--paper);
    font-family:'Public Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:24px;
  }
  .wrap{max-width:560px; width:100%; text-align:center;}
  .logo{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'Oswald', sans-serif; font-size:17px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.03em; text-decoration:none; color:var(--paper);
    margin-bottom:44px;
  }
  .logo .mark{
    width:32px; height:32px; border:2px solid var(--amber); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:var(--amber); flex-shrink:0;
  }
  .code{
    font-family:'IBM Plex Mono', monospace; font-size:14px; font-weight:600;
    letter-spacing:0.16em; color:var(--amber); margin-bottom:18px;
  }
  h1{
    font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.01em;
    font-size:clamp(30px, 5vw, 44px); line-height:1.1; margin:0 0 16px; font-weight:700;
  }
  p.lede{font-size:16px; line-height:1.6; color:var(--paper-dim); margin:0 0 40px;}
  .links{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-bottom:44px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 22px;
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    text-decoration:none; border-radius:var(--radius);
    transition:transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    white-space:nowrap;
  }
  .btn-amber{background:var(--amber); color:var(--asphalt);}
  .btn-amber:hover{background:#ffbf5c; transform:translateY(-1px);}
  .btn-outline{border:1.5px solid var(--paper-dim); color:var(--paper);}
  .btn-outline:hover{border-color:var(--amber); color:var(--amber);}
  .placard{
    background:var(--paper); color:var(--asphalt); border-radius:4px;
    padding:16px 22px; font-size:12px; letter-spacing:0.03em; line-height:1.6;
    display:inline-block;
  }
  .placard b{font-family:'IBM Plex Mono', monospace;}
</style>
</head>
